<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#bb6d35"><title>多肉サファリ</title><link rel="stylesheet" href="style.css"><style>#hud[hidden]{display:none}#title{background-image:linear-gradient(180deg,#17202926,transparent 42%,#21100699),url('assets/images/background/mexican-trail.png');background-size:cover;background-position:center}</style></head><body><main id="app"><canvas id="game" aria-label="多肉サファリ"></canvas><div class="vignette"></div>
<section id="title" class="screen active"><div class="brand"><span class="eyebrow">MEXICAN WILD EXPEDITION</span><h1>多肉<br><b>サファリ</b></h1><p>砂煙の向こうに、まだ見ぬ原種。</p></div><div class="actions"><button id="start" class="primary"><small>EXPEDITION</small>サファリへ出発</button><button id="collection" class="secondary">COLLECTION <span id="collectionCount">0 / 7</span></button></div><p class="hint">画面を左右になぞってジープを操ろう</p></section>
<header id="hud" hidden><div><small>SCORE</small><strong id="score">00000</strong></div><div class="speed"><small>SPEED</small><span id="speedBars"></span></div><div><small>RARE</small><strong id="rare">0</strong></div></header><button id="sound">♪</button>
<section id="result" class="screen panel-screen"><article class="panel"><span class="eyebrow">EXPEDITION REPORT</span><h2 id="resultTitle">サファリ終了</h2><div class="result-score"><small>SCORE</small><strong id="finalScore">0</strong></div><div id="haul" class="haul"></div><button id="retry" class="primary">もう一度 出発</button><button class="secondary home">キャンプへ戻る</button></article></section>
<section id="collectionScreen" class="screen panel-screen"><article class="panel"><div class="panel-head"><div><span class="eyebrow">FIELD ARCHIVE</span><h2>Collection Box</h2></div><button class="close home">×</button></div><p class="collection-copy">原生地で出会った特別な多肉たち</p><div id="collectionGrid" class="grid"></div></article></section><div id="toast"></div><div id="flash"></div></main><script type="module" src="src/main.js?v=visual2"></script></body></html>
